<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
     width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">ShinyPopGen — icône</title>
  <desc id="d">Double hélice d'ADN stylisée dans un disque bleu nuit.</desc>

  <defs>
    <linearGradient id="strand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3ED8FF"/>
      <stop offset="100%" stop-color="#00A6E0"/>
    </linearGradient>
  </defs>

  <!-- disque de fond : supprime cette ligne pour un fond 100% transparent -->
  <circle cx="256" cy="256" r="248" fill="#1B2A6B"/>

  <g fill="none" stroke-linecap="round">
    <!-- barreaux (derrière les brins) -->
    <g stroke="#5BE7C4" stroke-width="12" opacity="0.9">
      <line x1="185" y1="131" x2="327" y2="131"/>
      <line x1="156" y1="156" x2="356" y2="156"/>
      <line x1="185" y1="181" x2="327" y2="181"/>

      <line x1="185" y1="231" x2="327" y2="231"/>
      <line x1="156" y1="256" x2="356" y2="256"/>
      <line x1="185" y1="281" x2="327" y2="281"/>

      <line x1="185" y1="331" x2="327" y2="331"/>
      <line x1="156" y1="356" x2="356" y2="356"/>
      <line x1="185" y1="381" x2="327" y2="381"/>
    </g>

    <!-- brin A : part vers la droite -->
    <path stroke="url(#strand)" stroke-width="26"
          d="M256,106 C389,131 389,181 256,206
                     C123,231 123,281 256,306
                     C389,331 389,381 256,406"/>

    <!-- brin B : miroir, part vers la gauche -->
    <path stroke="url(#strand)" stroke-width="26"
          d="M256,106 C123,131 123,181 256,206
                     C389,231 389,281 256,306
                     C123,331 123,381 256,406"/>

    <!-- nucléotides aux extrémités les plus larges -->
    <g fill="#5BE7C4" stroke="none">
      <circle cx="156" cy="156" r="14"/><circle cx="356" cy="156" r="14"/>
      <circle cx="156" cy="256" r="14"/><circle cx="356" cy="256" r="14"/>
      <circle cx="156" cy="356" r="14"/><circle cx="356" cy="356" r="14"/>
    </g>
  </g>
</svg>