<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
     width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">ShinyPopGen — icône</title>
  <desc id="d">Double hélice d'ADN stylisée dans un disque bleu nuit.</desc>

  <defs>
    <linearGradient id="strand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3ED8FF"/>
      <stop offset="100%" stop-color="#00A6E0"/>
    </linearGradient>
  </defs>

  <!-- disque de fond : supprime cette ligne pour un fond 100% transparent -->
  <circle cx="256" cy="256" r="248" fill="#1B2A6B"/>

  <g id="mark" fill="none" stroke-linecap="round">
    <!-- barreaux -->
    <g stroke="#5BE7C4" stroke-width="9" opacity="0.9">
      <line x1="216" y1="145" x2="296" y2="145"/>
      <line x1="200" y1="162" x2="312" y2="162"/>
      <line x1="216" y1="179" x2="296" y2="179"/>
      <line x1="216" y1="213" x2="296" y2="213"/>
      <line x1="200" y1="230" x2="312" y2="230"/>
      <line x1="216" y1="247" x2="296" y2="247"/>
      <line x1="216" y1="281" x2="296" y2="281"/>
      <line x1="200" y1="298" x2="312" y2="298"/>
      <line x1="216" y1="315" x2="296" y2="315"/>
      <line x1="216" y1="349" x2="296" y2="349"/>
      <line x1="200" y1="366" x2="312" y2="366"/>
      <line x1="216" y1="383" x2="296" y2="383"/>
    </g>

    <!-- brin A -->
    <path stroke="url(#strand)" stroke-width="18"
          d="M256,128 C331,143 331,181 256,196
                     C181,211 181,249 256,264
                     C331,279 331,317 256,332
                     C181,347 181,385 256,400"/>
    <!-- brin B -->
    <path stroke="url(#strand)" stroke-width="18"
          d="M256,128 C181,143 181,181 256,196
                     C331,211 331,249 256,264
                     C181,279 181,317 256,332
                     C331,347 331,385 256,400"/>

    <!-- nucléotides aux extrémités des barreaux les plus larges -->
    <g fill="#5BE7C4" stroke="none">
      <circle cx="200" cy="162" r="11"/><circle cx="312" cy="162" r="11"/>
      <circle cx="200" cy="230" r="11"/><circle cx="312" cy="230" r="11"/>
      <circle cx="200" cy="298" r="11"/><circle cx="312" cy="298" r="11"/>
      <circle cx="200" cy="366" r="11"/><circle cx="312" cy="366" r="11"/>
    </g>
  </g>
</svg>